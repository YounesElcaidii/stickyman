name: Render Video

on:
  workflow_dispatch:
    inputs:
      short:
        description: "Which Short to render (folder in src/shorts), or 'all'"
        type: choice
        options:
          - someone-at-the-door
          - mcflurry-spoon
          - cheese-allergy
          - airplane-window
          - all
        default: "mcflurry-spoon"
        required: true
  # Also renders on pull requests that touch the videos, so each MP4 can be checked before merging.
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package*.json"
      - "requirements.txt"
      - ".github/workflows/render-video.yml"

permissions:
  contents: read

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lists the Shorts to render: the one picked by hand, or every Short on a pull request.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      shorts: ${{ steps.list.outputs.shorts }}
    steps:
      - uses: actions/checkout@v4
        with:
          # on a pull request, look at the branch's newest commit (and its parent) to see which Short it touches
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: list
        env:
          PICK: ${{ inputs.short || 'all' }}
        run: |
          # A pull request renders only the Shorts its newest commit touches; if that commit
          # touches no Short folder (shared code only), every Short is rendered.
          touched=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            touched=$(git diff --name-only HEAD~1 HEAD | sed -n 's#^src/shorts/\([^/]*\)/.*#\1#p' | sort -u | while read -r d; do [ -f "src/shorts/$d/narration.json" ] && echo "$d"; done)
          fi
          if [ -n "$touched" ]; then
            shorts=$(echo "$touched" | python3 -c "import sys,json;print(json.dumps(sys.stdin.read().split()))")
          elif [ "$PICK" = "all" ]; then
            shorts=$(ls -d src/shorts/*/ | xargs -n1 basename | python3 -c "import sys,json;print(json.dumps(sys.stdin.read().split()))")
          else
            test -f "src/shorts/$PICK/narration.json"
            shorts=$(python3 -c "import sys,json;print(json.dumps([sys.argv[1]]))" "$PICK")
          fi
          echo "shorts=$shorts" >> "$GITHUB_OUTPUT"
          echo "Rendering: $shorts"

  render:
    needs: plan
    name: render (${{ matrix.short }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        short: ${{ fromJson(needs.plan.outputs.shorts) }}
    env:
      SHORT: ${{ matrix.short }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Composition id, file name and artifact name come from the Short's narration.json.
      - name: Read this Short's settings
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os
          cfg = json.load(open(f"src/shorts/{os.environ['SHORT']}/narration.json"))
          print(f"COMPOSITION={cfg['composition']}")
          print(f"OUTPUT={cfg['outputName']}")
          print(f"ARTIFACT={cfg['artifactName']}")
          # Shorts with 3D scenes name the WebGL renderer the headless browser must use.
          print(f"GL_FLAG={'--gl=' + cfg['gl'] if cfg.get('gl') else ''}")
          # A Short still in review renders only its short motion sample (plus voice auditions).
          sample = cfg.get("sample", {}) if cfg.get("sampleOnly") else {}
          print(f"SAMPLE_ONLY={'true' if sample else 'false'}")
          print(f"SAMPLE_COMPOSITION={sample.get('composition', '')}")
          print(f"SAMPLE_OUTPUT={sample.get('outputName', '')}")
          print(f"SAMPLE_ARTIFACT={sample.get('artifactName', 'sample')}")
          print(f"SAMPLE_SECONDS={sample.get('seconds', 5)}")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # ffmpeg is usually already on the runner. Installing it is bounded: a slow package mirror
      # once spent 19 minutes in "apt-get update".
      - name: Make sure ffmpeg is available
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            echo "ffmpeg already installed: $(ffmpeg -version | head -n1)"
          else
            timeout 180 sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::Retries=2 update -qq || echo "::warning::apt-get update was slow or failed; trying the install anyway"
            timeout 300 sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::Retries=2 install -y -qq ffmpeg
            ffmpeg -version | head -n1
          fi

      - name: Install text-to-speech and speech-check tools (free, no API keys)
        run: pip install -r requirements.txt

      - name: Cache voice and speech-check models
        uses: actions/cache@v4
        with:
          path: |
            .voices
            ~/.cache/huggingface
          key: speech-models-${{ hashFiles('src/shorts/*/narration.json', 'requirements.txt') }}

      # Step 1: prove the voice works BEFORE rendering anything.
      # Fails with the exact error if the voice cannot be downloaded or does not speak clear English.
      - name: Generate and check a short voice sample
        if: env.SAMPLE_ONLY != 'true'
        run: python3 scripts/make_voice.py "$SHORT" --preview-only

      - name: Generate full narration and caption timing
        if: env.SAMPLE_ONLY != 'true'
        run: python3 scripts/make_voice.py "$SHORT"

      - name: Generate sound effects
        run: python3 scripts/make_sfx.py

      - name: Install Node packages
        run: npm ci

      - name: Install headless browser for Remotion
        run: npx remotion browser ensure

      # 3D Shorts only: a few half-size stills first, to catch black frames or WebGL failures
      # and to measure that the moving parts really connect, before spending minutes on the full render.
      - name: Short 3D test (WebGL stills)
        if: env.SAMPLE_ONLY != 'true'
        run: python3 scripts/smoke_test_3d.py "$SHORT"

      - name: Render 1080x1920 video
        if: env.SAMPLE_ONLY != 'true'
        run: |
          mkdir -p out
          npx remotion render "$COMPOSITION" "out/$OUTPUT.mp4" --concurrency=2 $GL_FLAG

      - name: Check the delivery file (size, streams, speech, clipping, frames)
        if: env.SAMPLE_ONLY != 'true'
        run: python3 scripts/check_video.py "out/$OUTPUT.mp4" "$SHORT"

      - name: Write run summary
        if: always() && env.SAMPLE_ONLY != 'true'
        run: |
          {
            if [ -f out/check-report.md ]; then cat out/check-report.md; else echo "## Render stopped before the delivery check"; echo; echo "Open the failed step above for the exact error."; fi
            echo
            if [ -f "public/shorts/$SHORT/timing.json" ]; then
              echo "Voice: $(python3 -c "import json,sys;t=json.load(open(sys.argv[1]));print(t['voice'],'| caption sync:',t['captionSync'],'| length:',t['totalSeconds'],'s')" "public/shorts/$SHORT/timing.json")"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Only a file that passed every check is published.
      - name: Collect delivery files
        if: env.SAMPLE_ONLY != 'true'
        run: |
          mkdir -p deliver
          cp "out/$OUTPUT.mp4" out/voice-*.wav out/voice-license.txt out/check-report.md deliver/
          cp -r out/frames deliver/frames
          if [ -d out/3d-test ]; then cp -r out/3d-test deliver/3d-test; fi

      - name: Upload MP4
        if: env.SAMPLE_ONLY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: deliver/
          if-no-files-found: error
          retention-days: 30

      # ---- Shorts still in review: a short motion sample and voice auditions instead of the full video ----
      - name: Render motion sample
        if: env.SAMPLE_ONLY == 'true'
        run: |
          mkdir -p out
          npx remotion render "$SAMPLE_COMPOSITION" "out/$SAMPLE_OUTPUT.mp4" --concurrency=2 $GL_FLAG

      - name: Check motion sample (size, length, picture, sound)
        if: env.SAMPLE_ONLY == 'true'
        run: python3 scripts/check_sample.py "out/$SAMPLE_OUTPUT.mp4" "$SAMPLE_SECONDS"

      - name: Voice auditions (candidate voices and their licenses)
        if: env.SAMPLE_ONLY == 'true'
        run: python3 scripts/voice_auditions.py "$SHORT"

      - name: Collect sample files
        if: env.SAMPLE_ONLY == 'true'
        run: |
          mkdir -p deliver-sample
          cp "out/$SAMPLE_OUTPUT.mp4" deliver-sample/
          cp -r out/sample-frames deliver-sample/frames
          cp -r out/auditions deliver-sample/voice-auditions

      - name: Upload motion sample
        if: env.SAMPLE_ONLY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SAMPLE_ARTIFACT }}
          path: deliver-sample/
          if-no-files-found: error
          retention-days: 30

      # If anything failed, still share the voice sample and logs so the problem can be judged.
      - name: Upload voice sample for debugging (failed runs only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-debug-${{ matrix.short }}
          path: |
            out/voice-*.wav
            out/voice-license.txt
            out/check-report.md
            out/frames
            out/3d-test
          if-no-files-found: ignore
          retention-days: 7
